<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@600&display=swap");
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;background:linear-gradient(180deg,#0A0A0F 0%,#0D1525 50%,#0A0A0F 100%);color:#F0F0F0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 80px;text-align:center;position:relative;}
.glow-top{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(0,212,255,0.12) 0%,transparent 70%);border-radius:50%;}
.glow-bot{position:absolute;bottom:-100px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 70%);border-radius:50%;}
.headshot-box{width:320px;height:320px;border-radius:50%;background:linear-gradient(135deg,#00D4FF,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:100px;margin-bottom:60px;border:5px solid #00D4FF;box-shadow:0 0 60px rgba(0,212,255,0.4);z-index:1;}
.emoji-badge{font-size:80px;margin-bottom:30px;z-index:1;}
h1{font-size:96px;font-weight:900;line-height:1.05;margin-bottom:24px;text-transform:uppercase;z-index:1;}
h1 span{color:#00D4FF;display:block;}
.sub{font-size:40px;color:#8888AA;font-family:"JetBrains Mono",monospace;margin-bottom:40px;z-index:1;}
.handle{font-family:"JetBrains Mono",monospace;color:#00D4FF;font-size:36px;font-weight:600;z-index:1;}
.bar{position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#00D4FF,#7C3AED);}
.bar-bot{position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#7C3AED,#00D4FF);}
</style></head><body>
<div class="bar"></div><div class="bar-bot"></div>
<div class="glow-top"></div><div class="glow-bot"></div>
<div class="headshot-box">👤</div>
<div class="emoji-badge">🌍</div>
<h1>175 Languages, Zero Re-recording</h1>
<div class="sub">HeyGen Translation Explained</div>
<div class="handle">@ScaleAIPros</div>
</body></html>
