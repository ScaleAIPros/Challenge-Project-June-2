<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap");
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1080px; height:1350px; overflow:hidden; font-family:Inter,sans-serif; background:#0A0A0F; color:#F0F0F0; }
body { background: linear-gradient(135deg, #0A0A0F 0%, #0D1A2E 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px; position:relative; }
.glow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:600px; height:600px; background:radial-gradient(circle,rgba(0,212,255,0.12) 0%,transparent 70%); border-radius:50%; }
.emoji { font-size:120px; margin-bottom:40px; position:relative; z-index:1; }
.tag { font-family:"JetBrains Mono",monospace; font-size:20px; color:#00D4FF; letter-spacing:4px; text-transform:uppercase; margin-bottom:30px; position:relative; z-index:1; }
h1 { font-size:90px; font-weight:900; line-height:1.05; margin-bottom:30px; position:relative; z-index:1; }
h1 span { color:#00D4FF; }
.sub { font-size:32px; color:#8888AA; line-height:1.5; position:relative; z-index:1; max-width:800px; }
.handle { position:absolute; bottom:60px; right:60px; font-family:"JetBrains Mono",monospace; color:#00D4FF; font-size:24px; font-weight:600; }
.num { position:absolute; top:60px; left:60px; font-family:"JetBrains Mono",monospace; color:#1E1E2E; font-size:20px; }
</style></head><body>
<div class="glow"></div>
<div class="num">1 / 6</div>
<div class="emoji">🎬</div>
<div class="tag">AI Video — No Camera</div>
<h1>Make Videos<br/>Without<br/><span>Going Live</span></h1>
<p class="sub">7 things every business owner<br/>needs to know about HeyGen 2026</p>
<div class="handle">@ScaleAIPros</div>
</body></html>
